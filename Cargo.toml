[package]
name = "belt"
version = "2026.9.16"
edition = "2024"

[[bin]]
name = "belt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
colored = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "form", "rustls"] }
scraper = "0.27.0"
rpassword = "7.5.4"
reqwest_cookie_store = { version = "0.10.0", features = ["serde"] }
cookie_store = { version = "0.22.1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
