[package]
name = "belt"
version = "2026.9.16"
edition = "2024"

[[bin]]
name = "belt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
colored = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
