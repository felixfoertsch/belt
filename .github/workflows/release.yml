name: Build and release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/belt belt-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: belt-${{ matrix.target }}
          path: belt-${{ matrix.target }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: calver-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Choose CalVer tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(date -u +%Y.%m.%d)"
          tag="$base"
          suffix=1
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            tag="$base.$suffix"
            suffix=$((suffix + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "${{ steps.version.outputs.tag }}" \
            dist/belt-*
